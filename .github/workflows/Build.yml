name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip project
        run: |
          Z=$(find . -maxdepth 2 -iname 'GlassIcons*.zip' -not -path './.git/*' | head -n1)
          if [ -z "$Z" ]; then echo "GlassIcons.zip not found in the repo"; ls -R | head -50; exit 1; fi
          rm -rf proj && mkdir proj && unzip -q -o "$Z" -d proj
          S=$(find proj -name settings.gradle.kts | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle.kts not found inside the zip"; exit 1; fi
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: Build
        run: cd "$PROJ" && gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlassIcons-debug
          path: "proj/**/app/build/outputs/apk/debug/*.apk"
